<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lumina — Dean1 Home Dashboard. Course slot allocation overview.">
  <title>Lumina — Dashboard</title>
  <link rel="stylesheet" href="css/Dean1_shared.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/Dean1_dashboard.css">
</head>

<body>

  <header id="navbar" class="navbar"></header>

  <main class="main-content">

    <!-- ── Progress Section ── -->

    <!-- ── Stat Cards ── -->

    <!-- ── Bottom Section: Room table + Recent Activities ── -->
    <section class="dashboard-bottom">

      <!-- Room Availability Overview -->
      <div class="card room-panel" id="roomPanel">
        <h2 class="room-panel__title">Room Availability Overview</h2>
        <div class="room-panel__filters">
          <div class="room-panel__filter">
            <label for="dayFilter" class="room-panel__filter-label">Day</label>
            <select id="dayFilter" class="select-field select-field--sm">
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
            </select>
          </div>
          <div class="room-panel__filter">
            <label for="roomFilter" class="room-panel__filter-label">Room</label>
            <select id="roomFilter" class="select-field select-field--sm">
              <!-- JS populates -->
            </select>
          </div>
        </div>
        <!-- Single room card with pagination -->
        <div class="room-card" id="roomCard">
          <div class="room-card__name" id="roomCardName">—</div>
          <div class="room-card__meta">
            <div class="room-card__meta-item">
              <span class="room-card__meta-label">Capacity</span>
              <span class="room-card__meta-value" id="roomCardCapacity">—</span>
            </div>
            <div class="room-card__meta-item">
              <span class="room-card__meta-label">Status</span>
              <span id="roomCardStatus">—</span>
            </div>
          </div>
          <div class="room-card__slots" id="roomCardSlots">
            <!-- available time slot tags rendered here -->
          </div>
        </div>

      </div>

      <!-- Recent Activities -->
      <div class="card activity-panel" id="activityPanel">
        <h2 class="activity-panel__title">Recent Activities</h2>
        <div class="activity-table-wrapper">
          <table class="data-table" id="activityTable">
            <thead>
              <tr>
                <th>Activity</th>
                <th>Details</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="activityTableBody">
              <!-- JS will populate -->
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>
  <!-- Modals removed — content is now inline -->

  <footer id="footer" class="footer"></footer>

  <script src="js/Dean1_data.js"></script>
  <script src="js/Dean1_layout.js"></script>
  <script src="js/Dean1_dashboard.js"></script>
</body>

</html>
