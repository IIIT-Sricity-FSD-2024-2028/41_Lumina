<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #061237 0%, #1c274c 100%);
            padding: 20px;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .login-header {
            background-color: #f8f9ff;
            border-bottom: 1px solid var(--border-color);
            padding: 32px 24px 20px;
            text-align: center;
        }
        .login-logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: -0.03em;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }
        .login-body {
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .form-input {
            width: 100%;
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(0, 81, 213, 0.15);
        }
        .quick-roles {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 16px;
        }
        .quick-roles-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-deemphasized);
        }
        .quick-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .role-btn {
            background-color: var(--surface-low);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }
        .role-btn:hover {
            background-color: var(--primary-dark);
            color: #ffffff;
            border-color: var(--primary-dark);
        }
        .role-btn.elevated {
            background-color: #ffdad6;
            color: #93000a;
            border-color: rgba(186, 26, 26, 0.3);
            grid-column: span 2;
        }
        .role-btn.elevated:hover {
            background-color: #93000a;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">Lumina</div>
            <div class="login-subtitle">Course Enrollment & Academic Planning System</div>
        </div>
        <form class="login-body" id="login-form">
            <div class="form-group">
                <label class="form-label">Email or ID</label>
                <input type="text" class="form-input" id="login-email" value="sysadmin@lumina.edu" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="login-password" value="password123" required>
            </div>
            <button type="submit" class="btn btn-primary" style="height: 40px; font-weight: 600; font-size: 14px;">
                Sign In to Lumina
            </button>

            <div class="quick-roles">
                <div class="quick-roles-title">Demo Quick Access:</div>
                <div class="quick-btn-grid">
                    <button type="button" class="role-btn elevated" id="btn-quick-superuser">
                        ★ Super User / Dean Elevated Access
                    </button>
                    <button type="button" class="role-btn" id="btn-quick-faculty">
                        Faculty Access
                    </button>
                    <button type="button" class="role-btn" id="btn-quick-student">
                        Student Access
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        function setSessionAndGo(session) {
            localStorage.setItem('Lumina_Session', JSON.stringify(session));
            window.location.href = 'super_user.html';
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Default login as Dean / Super User
            setSessionAndGo({
                User_ID: 'D9920102',
                Full_Name: 'Dr. Sarah Connor (Admin)',
                Role: 'Dean',
                Dept_ID: 'AIDS',
                Email: document.getElementById('login-email').value || 'sysadmin@lumina.edu'
            });
        });

        document.getElementById('btn-quick-superuser').addEventListener('click', () => {
            setSessionAndGo({
                User_ID: 'D9920102',
                Full_Name: 'Dr. Sarah Connor (Super User)',
                Role: 'Dean',
                Dept_ID: 'AIDS',
                Email: 'sysadmin@lumina.edu'
            });
        });

        document.getElementById('btn-quick-faculty').addEventListener('click', () => {
            setSessionAndGo({
                User_ID: 'F1092834',
                Full_Name: 'Dr. Arthur Pendelton',
                Role: 'Faculty',
                Dept_ID: 'ECE',
                Email: 'a.pendelton@lumina.edu'
            });
        });

        document.getElementById('btn-quick-student').addEventListener('click', () => {
            setSessionAndGo({
                User_ID: 'S2024001',
                Full_Name: 'Eleanor Vance',
                Role: 'Student',
                Dept_ID: 'CSE',
                Email: 'e.vance@lumina.edu'
            });
        });
    </script>
</body>
</html>
